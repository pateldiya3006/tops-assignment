<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Cards</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f1f3f6;
        }

        .card{
            transition:0.3s;
        }

        

        .card img{
             width: 100%;
             height: 250px;
             object-fit: contain;
              padding: 10px;
             background-color: white;
}

        .price{
            color:green;
            font-size:22px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Flipkart Product Cards</h2>

    <div class="row">


        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <img src="puma.jpg" class="card-img-top" alt="Puma Shoes">

                <div class="card-body text-center">
                    <h4 class="card-title">Puma Sneakers</h4>

                    <p class="price">₹3,999</p>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <img src="smartwatch.jpg" class="card-img-top" alt="Watch">

                <div class="card-body text-center">
                    <h4 class="card-title">Smart Watch</h4>

                    <p class="price">₹2,499</p>

                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <img src="headphones.jpg" class="card-img-top" alt="Headphones">

                <div class="card-body text-center">
                    <h4 class="card-title">Wireless Headphones</h4>

                    <p class="price">₹1,999</p>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>
        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
