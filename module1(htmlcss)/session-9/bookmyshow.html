<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive BookMyShow Movie Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f5f5f5;
        }

        .movie-box{
            background:white;
            padding:30px;
            margin-top:50px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        .movie-box img{
             width:100%;
             max-height:450px;
             height:auto;
            object-fit:contain;
            border-radius:10px;
        }

        h2{
            font-weight:bold;
        }

        .genre{
            color:#555;
            font-size:20px;
            margin-top:10px;
        }

        .rating{
            color:#ff9800;
            font-size:22px;
            font-weight:bold;
            margin-top:15px;
        }

        .btn-danger{
            margin-top:20px;
            padding:10px 30px;
            font-size:18px;
        }

        @media (max-width:576px){

            .movie-box{
                padding:20px;
                text-align:center;
            }

            .movie-box img{
                height:350px;
                margin-bottom:20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="movie-box">

        <div class="row align-items-center">

            <div class="col-12 col-md-6">
                <img src="war2.jpg" class="img-fluid" alt="Movie Poster">
            </div>

            <div class="col-12 col-md-6">
                <h2>War 2</h2>

                <p class="genre">
                    <strong>Genre:</strong> Action, Thriller
                </p>

                <p class="rating">
                    ⭐ 8.8/10
                </p>

                <p>
                    War 2 is an action-packed Bollywood movie with thrilling action,
                    powerful performances, and exciting adventures.
                </p>

                <button class="btn btn-danger">
                    Book Now
                </button>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
