<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Filter Buttons</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f5f5f5;
        }

        .filter-box{
            text-align:center;
            margin-top:60px;
        }

        h2{
            margin-bottom:30px;
            color:#e23744;
            font-weight:bold;
        }

        .btn{
            margin:5px;
            padding:10px 25px;
        }
    </style>

</head>
<body>

<div class="container">

    <div class="filter-box">

        <h2>Food Categories</h2>

        <button class="btn btn-danger active">All</button>

        <button class="btn btn-outline-success">Veg</button>

        <button class="btn btn-outline-danger">Non-Veg</button>

        <button class="btn btn-outline-warning">Desserts</button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
