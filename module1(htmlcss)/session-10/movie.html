<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Featured Movies</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f5f5f5;
        }

        h2{
            text-align:center;
            margin:30px 0;
            font-weight:bold;
        }

       .carousel{
    width:60%;
    margin:auto;
}

.carousel-item img{
    width:100%;
    height:500px;
    object-fit:contain;
    background-color:#000;
    border-radius:10px;
}

        .carousel-caption{
            background:rgba(0,0,0,0.6);
            border-radius:8px;
            padding:10px;
        }

        .carousel-caption h5{
            font-size:24px;
            font-weight:bold;
        }

        .carousel-caption p{
            font-size:16px;
        }
    </style>
</head>
<body>

<h2>Featured Movies</h2>

<div id="movieCarousel" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-indicators">
        <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="2"></button>
    </div>

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="war2.jpg" alt="War 2">

            <div class="carousel-caption">
                <h5>War 2</h5>
                <p>Action | Thriller</p>
            </div>
        </div>

        <div class="carousel-item">
            <img src="coolie.jpg" alt="Coolie">

            <div class="carousel-caption">
                <h5>Coolie</h5>
                <p>Action | Drama</p>
            </div>
        </div>

        <div class="carousel-item">
            <img src="kingdom.jpg" alt="Kingdom">

            <div class="carousel-caption">
                <h5>Kingdom</h5>
                <p>Adventure | Fantasy</p>
            </div>
        </div>

    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#movieCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#movieCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
