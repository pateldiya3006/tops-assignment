<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Laptop Card</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f1f3f6;
        }

        .card{
            width:350px;
            margin:50px auto;
            border:none;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card img{
            width:100%;
            height:250px;
            object-fit:contain;
            padding:15px;
            background:white;
        }

        .card-title{
            font-size:20px;
            font-weight:bold;
        }

        .price{
            color:green;
            font-size:24px;
            font-weight:bold;
        }

        .btn-primary{
            width:100%;
            margin-top:10px;
        }
    </style>

</head>
<body>

<div class="container">

    <div class="card">

        <img src="hp.jpg" class="card-img-top" alt="Laptop">

        <div class="card-body text-center">

            <h5 class="card-title">
                HP 15s Intel Core i5 12th Gen Laptop
            </h5>

            <p class="text-muted">
                16GB RAM | 512GB SSD | Windows 11
            </p>

            <h4 class="price">₹54,999</h4>

            <button class="btn btn-primary">
                Buy Now
            </button>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
