<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurant List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f5f5f5;
        }

        h2{
            text-align:center;
            margin:30px 0;
            color:#e23744;
        }

        .card{
            border:none;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card img{
         width:100%;
         height:220px;
        object-fit:cover;
        border-radius:10px 10px 0 0;
        }
    </style>

</head>
<body>

<div class="container">

    <h2>Zomato Restaurant List</h2>

    <div class="row">

        <div class="col-md-4 mb-4">

            <div class="card">

                <img src="spice.jpg" class="card-img-top" alt="Restaurant">

                <div class="card-body">

                    <h4 class="card-title">Spice Garden</h4>

                    <span class="badge bg-success">★ 4.6 Rating</span>

                    <span class="badge bg-warning text-dark">20% OFF</span>

                    <span class="badge bg-success">Open</span>

                </div>

            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card">

                <img src="pizza.jpg" class="card-img-top" alt="Restaurant">

                <div class="card-body">

                    <h4 class="card-title">Pizza Palace</h4>

                    <span class="badge bg-success">★ 4.4 Rating</span>

                    <span class="badge bg-info text-dark">Free Delivery</span>

                    <span class="badge bg-danger">Closed</span>

                </div>

            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card">

                <img src="royal.jpg" class="card-img-top" alt="Restaurant">

                <div class="card-body">

                    <h4 class="card-title">Royal Thali</h4>

                    <span class="badge bg-success">★ 4.8 Rating</span>

                    <span class="badge bg-primary">Buy 1 Get 1</span>

                    <span class="badge bg-success">Open</span>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
