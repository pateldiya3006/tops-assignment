<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Movie Review Card</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f5f5f5;
        }

        .card{
            width:350px;
            margin:50px auto;
            border:none;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        .card img{
            width:100%;
            height:450px;
            object-fit:cover;
            border-radius:10px 10px 0 0;
        }

        .rating{
            color:#ff9800;
        }
    </style>

</head>
<body>

<div class="container">

    <div class="card">

        <img src="war2.jpg" class="card-img-top" alt="Movie">

        <div class="card-body">

            <h2 class="fw-bold display-6">
                War 2
            </h2>

            <p class="fs-4 fw-semibold rating">
                ⭐ 8.8/10
            </p>

            <p class="fs-6 fw-normal text-secondary">
                War 2 is an action-packed Bollywood movie featuring thrilling action scenes, powerful performances, and an engaging storyline. A must-watch for action movie lovers.
            </p>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
