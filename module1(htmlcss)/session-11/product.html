<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Spacing Utilities</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f1f3f6;
        }

        h2{
            text-align:center;
            margin:30px 0;
        }

        .card img{
            height:220px;
            object-fit:contain;
            padding:15px;
        }

        .price{
            color:green;
            font-size:22px;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Flipkart Perfume Products</h2>

    <div class="row justify-content-center">

        <!-- Card 1 -->
        <div class="col-md-4 d-flex justify-content-center">
            <div class="card m-2 p-2" style="width:18rem;">
                <img src="perfume.jpg" class="card-img-top" alt="Perfume">
                <div class="card-body text-center">
                    <h5 class="card-title">Bella Vita Luxury</h5>
                    <p class="price">₹699</p>
                    <p class="text-muted">Margin: m-2 | Padding: p-2</p>
                </div>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="col-md-4 d-flex justify-content-center">
            <div class="card m-4 p-4" style="width:18rem;">
                <img src="perfume.jpg" class="card-img-top" alt="Perfume">
                <div class="card-body text-center">
                    <h5 class="card-title">Bella Vita Luxury</h5>
                    <p class="price">₹699</p>
                    <p class="text-muted">Margin: m-4 | Padding: p-4</p>
                </div>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="col-md-4 d-flex justify-content-center">
            <div class="card m-5 p-5" style="width:18rem;">
                <img src="perfume.jpg" class="card-img-top" alt="Perfume">
                <div class="card-body text-center">
                    <h5 class="card-title">Bella Vita Luxury</h5>
                    <p class="price">₹699</p>
                    <p class="text-muted">Margin: m-5 | Padding: p-5</p>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
