<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Spacing Utilities</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f1f3f6;
        }

        h2{
            text-align:center;
            margin-top:30px;
            margin-bottom:30px;
        }

        .card img{
            height:220px;
            object-fit:contain;
            padding:15px;
        }

        .price{
            color:green;
            font-size:22px;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Flipkart Perfume Product</h2>

    <div class="card m-2 p-2 mx-auto" style="width:320px;">

        <img src="perfume.jpg" class="card-img-top" alt="Perfume">

        <div class="card-body text-center">

            <h5 class="card-title">Bella Vita Luxury Perfume</h5>

            <p class="price">₹699</p>

        </div>

    </div>

    <div class="card m-4 p-4 mx-auto" style="width:320px;">

        <img src="perfume.jpg" class="card-img-top" alt="Perfume">

        <div class="card-body text-center">

            <h5 class="card-title">Bella Vita Luxury Perfume</h5>

            <p class="price">₹699</p>

        </div>

    </div>

    <div class="card m-5 p-5 mx-auto" style="width:320px;">

        <img src="perfume.jpg" class="card-img-top" alt="Perfume">

        <div class="card-body text-center">

            <h5 class="card-title">Bella Vita Luxury Perfume</h5>

            <p class="price">₹699</p>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
