<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Theme Switcher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            transition:0.3s;
        }

        .container{
            max-width:600px;
            margin-top:100px;
            padding:30px;
            border-radius:10px;
            transition:0.3s;
        }
    </style>
</head>

<body>

<div id="themeBox" class="container bg-light text-dark shadow text-center">

    <h2>Bootstrap Theme Switcher</h2>

    <p>
        Click the button below to switch between Light Mode and Dark Mode.
    </p>

    <button class="btn btn-primary" onclick="changeTheme()">
        Switch Theme
    </button>

</div>

<script>

function changeTheme(){

    let box = document.getElementById("themeBox");

    box.classList.toggle("bg-light");
    box.classList.toggle("text-dark");

    box.classList.toggle("bg-dark");
    box.classList.toggle("text-light");

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
