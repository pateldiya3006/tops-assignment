<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links Preview</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:#f5f5f5;
            font-family:Arial,sans-serif;
        }

        .form-box{
            width:500px;
            margin:40px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        .preview{
            width:500px;
            margin:20px auto;
        }

        .card{
            margin-bottom:20px;
            border-radius:10px;
            padding:20px;
        }

        .instagram{
            border-left:8px solid #E1306C;
            background:#fff0f6;
        }

        .linkedin{
            border-left:8px solid #0A66C2;
            background:#eef6ff;
        }

        .youtube{
            border-left:8px solid #FF0000;
            background:#fff1f1;
        }

        .icon{
            font-size:35px;
        }

        .visit{
            margin-top:10px;
        }

    </style>

</head>

<body>

<div class="form-box">

    <h2 class="text-center mb-4">Social Links Form</h2>

    <form id="socialForm">

        <div class="mb-3">
            <label>Instagram URL</label>
            <input type="url" id="instagram" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>LinkedIn URL</label>
            <input type="url" id="linkedin" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>YouTube URL</label>
            <input type="url" id="youtube" class="form-control" required>
        </div>

        <button class="btn btn-dark w-100">
            Submit
        </button>

    </form>

</div>

<div class="preview" id="preview"></div>

<script>

document.getElementById("socialForm").addEventListener("submit",function(e){

    e.preventDefault();

    let insta=document.getElementById("instagram").value;
    let linked=document.getElementById("linkedin").value;
    let youtube=document.getElementById("youtube").value;

    let instaName=insta.split("/").filter(Boolean).pop();
    let linkedName=linked.split("/").filter(Boolean).pop();
    let youtubeName=youtube.split("/").filter(Boolean).pop();

    document.getElementById("preview").innerHTML=`

    <div class="card instagram">

        <h4><i class="bi bi-instagram icon"></i> Instagram</h4>

        <p><strong>Username:</strong> ${instaName}</p>

        <a href="${insta}" target="_blank" class="btn btn-danger visit">
            Visit
        </a>

    </div>

    <div class="card linkedin">

        <h4><i class="bi bi-linkedin icon"></i> LinkedIn</h4>

        <p><strong>Username:</strong> ${linkedName}</p>

        <a href="${linked}" target="_blank" class="btn btn-primary visit">
            Visit
        </a>

    </div>

    <div class="card youtube">

        <h4><i class="bi bi-youtube icon"></i> YouTube</h4>

        <p><strong>Username:</strong> ${youtubeName}</p>

        <a href="${youtube}" target="_blank" class="btn btn-danger visit">
            Visit
        </a>

    </div>

    `;

});

</script>

</body>
</html>
