<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Tag Bio</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#111827;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .card{
            background:#1f2937;
            color:white;
            width:350px;
            text-align:center;
            border-radius:15px;
            padding:30px;
            box-shadow:0 5px 15px rgba(0,0,0,0.4);
        }

        .card img{
            width:150px;
            height:150px;
            border-radius:50%;
            object-fit:cover;
            border:4px solid #22c55e;
            margin-bottom:20px;
        }

        h2{
            margin-bottom:10px;
        }

        p{
            color:#d1d5db;
            margin-bottom:25px;
        }

        .links{
            display:flex;
            flex-direction:column;
            gap:15px;
        }

        .links a{
            text-decoration:none;
            background:#22c55e;
            color:white;
            padding:12px;
            border-radius:8px;
            font-weight:bold;
            transition:0.3s;
        }

        .links a:hover{
            background:#16a34a;
        }

        @media(max-width:768px){

            .card{
                width:100%;
            }

            .card img{
                width:120px;
                height:120px;
            }

            h2{
                font-size:24px;
            }

        }

    </style>

</head>

<body>

<div class="card">

    <img src="gamer.jpg" alt="Gamer">

    <h2>ShadowHunter</h2>

    <p>Professional Gamer | FPS Lover | Live Streaming Daily</p>

    <div class="links">

        <a href="#"> Twitch</a>

        <a href="#"> Discord</a>

        <a href="#">Steam</a>

    </div>

</div>

</body>
</html>
