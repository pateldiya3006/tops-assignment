<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Links Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f5f5f5;
        }

        .form-box{
            max-width:600px;
            margin:40px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        .preview-card{
            margin-top:20px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        a{
            text-decoration:none;
        }
    </style>

</head>
<body>

<div class="container">

    <div class="form-box">

        <h2 class="text-center mb-4">Music Links Form</h2>

        <form id="musicLinksForm">

            <div class="mb-3">
                <label class="form-label">Spotify Profile URL</label>
                <input type="url" class="form-control" id="spotify" required>
            </div>

            <div class="mb-3">
                <label class="form-label">YouTube Music Profile URL</label>
                <input type="url" class="form-control" id="youtube" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Apple Music Profile URL</label>
                <input type="url" class="form-control" id="apple" required>
            </div>

            <button type="submit" class="btn btn-success w-100">
                Submit
            </button>

        </form>

    </div>

    <div id="preview"></div>

</div>

<script>

document.getElementById("musicLinksForm").addEventListener("submit",function(e){

    e.preventDefault();

    let spotify=document.getElementById("spotify").value;
    let youtube=document.getElementById("youtube").value;
    let apple=document.getElementById("apple").value;

    document.getElementById("preview").innerHTML=`

    <div class="card preview-card p-4">

        <h3 class="text-center mb-3">Music Profile Links</h3>

        <p><strong>Spotify:</strong><br>
        <a href="${spotify}" target="_blank">${spotify}</a></p>

        <p><strong>YouTube Music:</strong><br>
        <a href="${youtube}" target="_blank">${youtube}</a></p>

        <p><strong>Apple Music:</strong><br>
        <a href="${apple}" target="_blank">${apple}</a></p>

    </div>

    `;

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
