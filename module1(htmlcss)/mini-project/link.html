<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:#f5f5f5;
        }

        .form-box{
            width:450px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        .input-box{
            position:relative;
            margin-bottom:20px;
        }

        .input-box i{
            position:absolute;
            left:15px;
            top:50%;
            transform:translateY(-50%);
            color:#777;
            font-size:18px;
        }

        .input-box input{
            width:100%;
            padding:12px 15px 12px 45px;
            border:1px solid #ccc;
            border-radius:6px;
            outline:none;
        }

        .input-box input:focus{
            border-color:#e23744;
        }

        button{
            width:100%;
            padding:12px;
            background:#e23744;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
        }

        button:hover{
            background:#c81d2d;
        }

    </style>

</head>

<body>

<div class="form-box">

    <h2 class="text-center mb-4">Social Links</h2>

    <form>

        <div class="input-box">

            <i class="bi bi-instagram"></i>

            <input type="url" placeholder="Instagram Profile URL">

        </div>

        <div class="input-box">

            <i class="bi bi-linkedin"></i>

            <input type="url" placeholder="LinkedIn Profile URL">

        </div>

        <div class="input-box">

            <i class="bi bi-youtube"></i>

            <input type="url" placeholder="YouTube Channel URL">

        </div>

        <button type="submit">
            Save Links
        </button>

    </form>

</div>

</body>
</html>
