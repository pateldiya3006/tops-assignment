<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Playlists</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#121212;
        }

        h2{
            color:white;
            text-align:center;
            margin:30px 0;
        }

        .card{
            background:#1e1e1e;
            color:white;
            border:none;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.3);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card img{
            height:250px;
            object-fit:cover;
            border-radius:12px 12px 0 0;
        }

        .btn-success{
            width:100%;
        }
    </style>

</head>
<body>

<div class="container">

    <h2>Featured Playlists</h2>

    <div class="row">

        <div class="col-md-4 mb-4">

            <div class="card">

                <img src="top.jpg" class="card-img-top" alt="Playlist">

                <div class="card-body text-center">

                    <h5 class="card-title">Top Hits 2026</h5>

                    <button class="btn btn-success">
                        Listen Now
                    </button>

                </div>

            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card">

                <img src="chill.jpg" class="card-img-top" alt="Playlist">

                <div class="card-body text-center">

                    <h5 class="card-title">Chill Vibes</h5>

                    <button class="btn btn-success">
                        Listen Now
                    </button>

                </div>

            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card">

                <img src="gym.jpg" class="card-img-top" alt="Playlist">

                <div class="card-body text-center">

                    <h5 class="card-title">Workout Mix</h5>

                    <button class="btn btn-success">
                        Listen Now
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
