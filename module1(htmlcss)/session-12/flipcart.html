<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Showcase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f1f3f6;
        }

        h2{
            text-align:center;
            margin:30px 0;
            font-weight:bold;
        }

        .card{
            border:none;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card img{
            height:220px;
            object-fit:contain;
            padding:15px;
            background:white;
        }

        .price{
            color:green;
            font-size:22px;
            font-weight:bold;
        }

        .btn{
            width:100%;
        }
    </style>

</head>
<body>

<div class="container">

    <h2>Flipkart Product Showcase</h2>

    <div class="row">

        <div class="col-6 col-md-3 mb-4">

            <div class="card">

                <img src="puma.jpg" class="card-img-top" alt="Shoes">

                <div class="card-body text-center">

                    <h5 class="card-title">Puma Shoes</h5>

                    <p class="price">₹2,999</p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>

        <div class="col-6 col-md-3 mb-4">

            <div class="card">

                <img src="smartwatch.jpg" class="card-img-top" alt="Watch">

                <div class="card-body text-center">

                    <h5 class="card-title">Fastrack Watch</h5>

                    <p class="price">₹1,499</p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>

        <div class="col-6 col-md-3 mb-4">

            <div class="card">

                <img src="bag.jpg" class="card-img-top" alt="Bag">

                <div class="card-body text-center">

                    <h5 class="card-title"> Bag</h5>

                    <p class="price">₹999</p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>

        <div class="col-6 col-md-3 mb-4">

            <div class="card">

                <img src="perfume.jpg" class="card-img-top" alt="Perfume">

                <div class="card-body text-center">

                    <h5 class="card-title">Bella Vita Perfume</h5>

                    <p class="price">₹699</p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
