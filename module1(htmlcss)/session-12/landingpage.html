<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f5f5;
        }

        section{
            padding:80px 20px;
            text-align:center;
        }

        #home{
            background:#ffffff;
        }

        #about{
            background:#e9ecef;
        }

        #contact{
            background:#ffffff;
        }
    </style>

</head>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">

    <div class="container">

        <a class="navbar-brand" href="#">Music Artist</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="#home">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#about">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#contact">Contact</a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<section id="home">

    <h1>Welcome to My Music World</h1>

    <p>
        Discover the latest songs, albums and live performances.
    </p>

</section>

<section id="about">

    <h2>About</h2>

    <p>
        This is a sample landing page for a music artist created using
        HTML, CSS and Bootstrap.
    </p>

</section>

<section id="contact">

    <h2>Contact</h2>

    <p>Email: musicartist@gmail.com</p>

    <p>Phone: +91 9876543210</p>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
